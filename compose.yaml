services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      JWT_SECRET: local-test-secret-not-for-production
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/tags').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
