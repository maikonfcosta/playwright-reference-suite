name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start Conduit
        run: docker compose up -d --build --wait

      - name: Critical ring
        run: npm run test:critical

      - name: Flaky report
        if: ${{ !cancelled() }}
        run: npm run flaky-report

      - name: API logs on failure
        if: failure()
        run: docker compose logs api

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: critical-report
          path: playwright-report
          retention-days: 14
