name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Runs a branch without opening a pull request (used by ai-ci-triage's evaluation branches).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  critical:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Start Conduit
        run: docker compose up -d --build --wait

      # The classifier below decides whether a red run blocks, so this step never fails the job itself.
      - name: Critical ring
        continue-on-error: true
        run: npm run test:critical

      - name: Classify failures
        id: classify
        if: ${{ !cancelled() }}
        uses: maikonfcosta/failure-classifier@v1
        with:
          report: test-results/results.json
          health-url: http://localhost:4200/api/tags

      - name: Explain failures (advisory only)
        id: triage
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              steps.classify.outputs.verdicts != '' &&
              hashFiles('test-results/results.json') != '' }}
        continue-on-error: true
        uses: maikonfcosta/ai-ci-triage@5cf7d486b8861ee677bcedf529accc4050ba246a
        with:
          report: test-results/results.json
          verdicts: ${{ steps.classify.outputs.verdicts }}
          github-token: ${{ github.token }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          max-input-tokens: '5500'

      - name: Save triage result
        if: ${{ !cancelled() && steps.triage.outputs.result != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ai-ci-triage-result
          path: ${{ steps.triage.outputs.result }}
          retention-days: 14

      - name: Flaky report
        if: ${{ !cancelled() }}
        run: npm run flaky-report

      - name: Collect the report and the verdicts
        if: ${{ !cancelled() }}
        env:
          VERDICTS: ${{ steps.classify.outputs.verdicts }}
        run: '[ -f "$VERDICTS" ] && cp "$VERDICTS" test-results/verdicts.json || true'

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: triage-input
          path: |
            test-results/results.json
            test-results/verdicts.json
          retention-days: 14

      - name: API logs on failure
        if: failure()
        run: docker compose logs api

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: critical-report
          path: playwright-report
          retention-days: 14
